name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/ai-workflow
    steps:
      - uses: actions/checkout@v4
      - name: Script tests
        run: |
          bash skills/jev/scripts/test_jev.sh
          bash skills/linear/scripts/test_linear.sh
          bash skills/orchestrator/scripts/test_cleanup.sh
          bash skills/orchestrator/scripts/test_status.sh
      - name: Prompts use no working-directory script paths
        run: |
          if grep -rnE '(^|[^/}])scripts/(jev|linear|test_)' skills agents; then
            echo "Use \${CLAUDE_PLUGIN_ROOT} or \${CLAUDE_SKILL_DIR}; agents read the path from the run context."
            exit 1
          fi
      - name: Prompts use the per-spec run state
        run: |
          if grep -rnE 'tmp/team/(handoff|design|review|qa|jev|ticket|feature)' skills agents ../../README.md; then
            echo "Run state lives in tmp/team/<spec slug>/; see skills/orchestrator/SKILL.md."
            exit 1
          fi
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace and plugins
        run: |
          claude plugin validate ../..
          claude plugin validate .
          claude plugin validate ../pomodoro
      - name: Mod tests
        run: |
          claude plugin test .
          claude plugin test ../pomodoro
